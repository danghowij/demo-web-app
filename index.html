<!DOCTYPE html>
<html>
<head>
<title>YOLO + Three.js Box Detection</title>
<style>

    body { margin: 0; overflow: hidden; }

    video, canvas { position: absolute; top: 0; left: 0; }

    #overlay { z-index: 10; position: absolute; color: white; background: rgba(0,0,0,0.5); padding: 4px; }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted width="640" height="480"></video>
<div id="overlay">Detecting...</div>
<canvas id="three-canvas"></canvas>
 
  <!-- TensorFlow + COCO-SSD -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.0.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
 
  <!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.153.0/build/three.min.js"></script>
 
  <script>

    const video = document.getElementById('video');

    const overlay = document.getElementById('overlay');
 
    async function setupCamera() {

      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });

      video.srcObject = stream;

      return new Promise(resolve => video.onloadedmetadata = resolve);

    }
 
    async function main() {

      await setupCamera();

      const model = await cocoSsd.load();
 
      // Setup Three.js scene

      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(75, 640 / 480, 0.1, 1000);

      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), alpha: true });

      renderer.setSize(640, 480);

      camera.position.z = 5;
 
      const boxMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true });

      const boxGeometry = new THREE.BoxGeometry(1, 1, 1);

      const boxMesh = new THREE.Mesh(boxGeometry, boxMaterial);

      scene.add(boxMesh);
 
      function renderLoop() {

        model.detect(video).then(predictions => {

          const box = predictions.find(p => p.class === 'book' || p.class === 'box' || p.class === 'cup');

          if (box) {

            overlay.innerText = `📦 ${box.class}: ${(box.bbox[2]).toFixed(1)} x ${(box.bbox[3]).toFixed(1)} px`;

            const [x, y, width, height] = box.bbox;

            // Map bbox size to 3D box (scale values for visualization)

            boxMesh.scale.set(width / 100, height / 100, 1);

            boxMesh.position.set((x - 320 + width / 2) / 100, -(y - 240 + height / 2) / 100, 0);

          } else {

            overlay.innerText = "No box detected";

            boxMesh.scale.set(0.001, 0.001, 0.001); // Hide box

          }
 
          renderer.render(scene, camera);

          requestAnimationFrame(renderLoop);

        });

      }
 
      renderLoop();

    }
 
    main();
</script>
</body>
</html>
